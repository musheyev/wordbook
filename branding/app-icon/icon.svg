  <path d="M31 24 H69 Q78 24 78 33 V99 Q78 108 71 103 L50 88 L29 103 Q22 108 22 99 V33 Q22 24 31 24 Z" fill="#fff"/>
  <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round">
